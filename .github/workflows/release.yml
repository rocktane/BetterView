name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (v1.0.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    env:
      # Match the toolchain used to validate the tests and universal archive locally.
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Validate tag and avoid overwriting an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git describe --tags --exact-match)" = "$RELEASE_TAG"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'A release already exists. Do not replace published assets.' >&2
            exit 1
          fi
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Verify toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Configure display for window tests
        run: |
          brew install displayplacer
          displayplacer list
          DISPLAY_ID=$(swift -e 'import CoreGraphics; print(CGMainDisplayID())')
          displayplacer "id:$DISPLAY_ID res:1920x1080 scaling:off"
          swift -e '
            import AppKit
            guard let screen = NSScreen.main else { fatalError("No test display") }
            print("Test display:", screen.visibleFrame, "scale:", screen.backingScaleFactor)
            precondition(screen.visibleFrame.width >= 1800,
                         "Window tests require a wide display")
          '
      - name: Build and test
        run: |
          xcodegen generate
          xcodebuild test -scheme BetterView -destination 'platform=macOS' -derivedDataPath build -resultBundlePath build/Tests.xcresult -quiet
      - name: Diagnose test failures
        if: failure()
        run: |
          swift -e 'import AppKit; print(NSScreen.screens.map { screen in screen.visibleFrame })'
          if [ -d build/Tests.xcresult ]; then
            xcrun xcresulttool get test-results summary --path build/Tests.xcresult --format json
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: build/Tests.xcresult
      - name: Package and sign Sparkle update
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY" || { echo 'Missing SPARKLE_PRIVATE_KEY secret' >&2; exit 1; }
          scripts/release.sh "$RELEASE_TAG"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag --title "BetterView ${RELEASE_TAG#v}" --generate-notes \
            "build/release/$RELEASE_TAG/BetterView-${RELEASE_TAG#v}.zip" \
            "build/release/$RELEASE_TAG/appcast.xml" \
            "build/release/$RELEASE_TAG/SHA256SUMS.txt"
