name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (v1.0.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Validate tag and avoid overwriting an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git describe --tags --exact-match)" = "$RELEASE_TAG"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'A release already exists. Do not replace published assets.' >&2
            exit 1
          fi
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build and test
        run: |
          xcodegen generate
          xcodebuild test -scheme BetterView -destination 'platform=macOS' -derivedDataPath build -quiet
      - name: Package and sign Sparkle update
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY" || { echo 'Missing SPARKLE_PRIVATE_KEY secret' >&2; exit 1; }
          scripts/release.sh "$RELEASE_TAG"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag --title "BetterView ${RELEASE_TAG#v}" --generate-notes \
            "build/release/$RELEASE_TAG/BetterView-${RELEASE_TAG#v}.zip" \
            "build/release/$RELEASE_TAG/appcast.xml" \
            "build/release/$RELEASE_TAG/SHA256SUMS.txt"
